asi yang butuh data kursi.</text><text x="58" y="418" font-size="12.5" fill="#b3b3b3" font-weight="400" text-anchor="start" letter-spacing="0">• Bayar terlambat (reservasi sudah EXPIRED/CANCELLED) → otomatis di-refund.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>