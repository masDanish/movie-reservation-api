</defs><rect width="1240" height="470" rx="18" fill="url(#bg)"/><rect width="1240" height="470" rx="18" fill="url(#glow)"/><text x="40" y="50" font-size="14" fill="#E50914" font-weight="700" text-anchor="start" letter-spacing="5">SIKLUS RESERVASI</text><text x="40" y="84" font-size="30" fill="#ffffff" font-weight="800" text-anchor="start" letter-spacing="0">Status Reservasi</text><circle cx="60" cy="255" r="10" fill="#E50914"/><path d="M72,255 L250,255" stroke="#E50914" stroke-width="2.4" marker-end="url(#ar)"/><text x="160" y="240" font-size="11.5" fill="#ff6b73" font-weight="600" text-anchor="middle" letter-spacing="0" font-family="Consolas,Menlo,monospace">POST /api/reservations</text><g filter="url(#shadow)"><rect x="254" y="215" width="220" height="80" rx="14" fill="#2b2200" stroke="#ffb400" stroke-width="2.5"/></g><text x="364.0" y="253.0" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="2">PENDING</text><text x="364.0" y="275.0" font-size="11.5" fill="#b3b3b3" font-weight="400" text-anchor="middle" letter-spacing="0">kursi ditahan · 15 menit</text><g filter="url(#shadow)"><rect x="800" y="120" width="260" height="80" rx="14" fill="#0e2a16" stroke="#46d369" stroke-width="2.5"/></g><text x="930.0" y="158.0" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="2">CONFIRMED</text><text x="930.0" y="180.0" font-size="11.5" fill="#b3b3b3" font-weight="400" text-anchor="middle" letter-spacing="0">tiket sah · siap nonton</text><g filter="url(#shadow)"><rect x="800" y="215" width="260" height="80" rx="14" fill="#222" stroke="#8a8a8a" stroke-width="2.5"/></g><text x="930.0" y="253.0" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="2">EXPIRED</text><text x="930.0" y="275.0" font-size="11.5" fill="#b3b3b3" font-weight="400" text-anchor="middle" letter-spacing="0">kursi dilepas kembali</text><g filter="url(#shadow)"><rect x="800" y="330" width="260" height="80" rx="14"